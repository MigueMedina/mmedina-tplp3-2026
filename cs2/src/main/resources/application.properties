spring.application.name=cs2

# =========================================================
# Base de datos H2 persistente
# =========================================================
# URL fija: la consola web y la aplicación deben usar exactamente la misma.
spring.datasource.url=jdbc:h2:file:./data/cs2db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

server.port=8080

# =========================================================
# OpenAPI / Swagger UI
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================================
# Clientes hacia A2 y A3 (POO-09)
# =========================================================
apis.a2.base-url=${A2_BASE_URL:http://localhost:8081}
apis.a2.openapi-url=${A2_OPENAPI_URL:}
apis.a2.operation-id=${A2_OPERATION_ID:validarMunicion}
apis.a2.metodo=POST
apis.a2.cuerpo.jugador-id=jugadorId
apis.a2.cuerpo.arma-id=armaId
apis.a2.cuerpo.dano=dano

apis.a3.base-url=${A3_BASE_URL:http://localhost:8082}
apis.a3.openapi-url=${A3_OPENAPI_URL:}
apis.a3.operation-id=${A3_OPERATION_ID:validarJugadorVivo}
apis.a3.metodo=POST
apis.a3.cuerpo.jugador-id=jugadorId
apis.a3.cuerpo.arma-id=armaId
apis.a3.cuerpo.dano=dano
